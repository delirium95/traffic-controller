[package]
name = "untitled"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
aes-gcm = "0.10.3"
base64 = "0.22.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
toml = "0.8.19"
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
rcgen = { version = "0.13.2", default-features = false, features = ["ring", "pem", "x509-parser"] }
